version: 1
cluster:
  name: personal-support-team
  mode: single_host
  primary_host: local
  description: Persoenliches OpenClaw-Team fuer Planung, Coaching und Pflegekoordination
hosts:
  - name: local
    quadlet_root: ~/.config/containers/systemd
instances:
  - name: alltags-navigator
    host: local
    role: product_owner
    workspace_path: ${CLAWAKE_PROJECT_ROOT}/personal-team/workspaces/navigator
    team_definition_path: ${CLAWAKE_PROJECT_ROOT}/personal-team/roles/navigator
    quadlet_path: alltags-navigator.container
    container_name: alltags-navigator
    image:
      repository: ghcr.io/openclaw/openclaw
      tag: "2026.8.2-browser"
      digest: sha256:e164a318801fad2d49dc19b99adadfa629fa5f9ffb43673e73661c1d3f9cc7de
      known_good_tag: "2026.8.2"
      known_good_digest: sha256:5d25165995041caa6a7175bec82b25ad98c44eb269bb42435da8e27ec06e6be4
    ports:
      - bind_address: 127.0.0.1
        host_port: 18789
        container_port: 18789
        protocol: tcp
      - bind_address: 127.0.0.1
        host_port: 18790
        container_port: 18790
        protocol: tcp
    env_files:
      - ${CLAWAKE_PROJECT_ROOT}/personal-team/env/navigator.env
    labels:
      env: personal
      audience: private
    gateway_runtime:
      enabled: true
      bind: lan
    backup_policy:
      enabled: true
      pre_mutation: true
      retention: 7
    dashboard:
      friendly_name: Alltags-Navigator
      owner: Personal
      description: Plant den Tag und koordiniert Prioritaeten
      tags: [planung, alltag, privat]

  - name: reflexions-coach
    host: local
    role: product_owner
    workspace_path: ${CLAWAKE_PROJECT_ROOT}/personal-team/workspaces/coach
    team_definition_path: ${CLAWAKE_PROJECT_ROOT}/personal-team/roles/coach
    quadlet_path: reflexions-coach.container
    container_name: reflexions-coach
    image:
      repository: ghcr.io/openclaw/openclaw
      tag: "2026.8.2"
      digest: sha256:5d25165995041caa6a7175bec82b25ad98c44eb269bb42435da8e27ec06e6be4
    ports:
      - bind_address: 127.0.0.1
        host_port: 18889
        container_port: 18789
        protocol: tcp
      - bind_address: 127.0.0.1
        host_port: 18890
        container_port: 18790
        protocol: tcp
    env_files:
      - ${CLAWAKE_PROJECT_ROOT}/personal-team/env/coach.env
    labels:
      env: personal
      audience: private
    gateway_runtime:
      enabled: true
      bind: lan
    backup_policy:
      enabled: true
      pre_mutation: true
      retention: 7
    dashboard:
      friendly_name: Reflexions-Coach
      owner: Personal
      description: Coacht wertschatzend und motiviert ohne Druck
      tags: [coaching, reflexion, motivation]

  - name: fokus-partner
    host: local
    role: developer
    workspace_path: ${CLAWAKE_PROJECT_ROOT}/personal-team/workspaces/fokus
    team_definition_path: ${CLAWAKE_PROJECT_ROOT}/personal-team/roles/fokus
    quadlet_path: fokus-partner.container
    container_name: fokus-partner
    image:
      repository: ghcr.io/openclaw/openclaw
      tag: "2026.9.2-browser"
      digest: sha256:f57ec52faf5e92da835ababa3b9ffd5fc820496f5c79247e483a9a4e46f51293
      known_good_tag: "2026.8.2-browser"
      known_good_digest: sha256:e164a318801fad2d49dc19b99adadfa629fa5f9ffb43673e73661c1d3f9cc7de
    ports:
      - bind_address: 127.0.0.1
        host_port: 18989
        container_port: 18789
        protocol: tcp
      - bind_address: 127.0.0.1
        host_port: 18990
        container_port: 18790
        protocol: tcp
    env_files:
      - ${CLAWAKE_PROJECT_ROOT}/personal-team/env/fokus.env
    # The host uses systemd-resolved's loopback stub, which aardvark-dns cannot
    # forward reliably from its network namespace. Use the LAN resolver directly.
    dns_servers:
      - 192.168.2.1
    plugins:
      - id: pflege-google-limited
        artifact_path: ${CLAWAKE_PROJECT_ROOT}/personal-team/plugins/pflege-google-limited/releases/pflege-google-limited-0.5.0-openclaw-2026.9.2.tgz
        sha256: sha256:9089f446331e93cee7ba786800621573f2bfc9b50bfe319e6749787341dc1d4e
        enabled: true
        custom_ui: true
        config:
          credentialsPath: /home/node/.openclaw/secrets/pflege-google-web-credentials.json
          tokenPath: /home/node/.openclaw/secrets/pflege-google-web-token.json
          publicOrigin: http://127.0.0.1:18989
    labels:
      env: personal
      audience: private
    gateway_runtime:
      enabled: true
      bind: lan
    backup_policy:
      enabled: true
      pre_mutation: true
      retention: 7
    dashboard:
      friendly_name: Pflegebetreuer
      owner: Personal
      description: Koordiniert familiaere Pflege, Kommunikation und Termine
      tags: [pflege, aok, termine, familie, privat]
