name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-test-render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Tests
        run: pytest -q

      - name: Validate + render examples
        run: |
          clawake validate -c examples/inventory/dev.yaml
          clawake validate -c examples/inventory/prod.yaml
          clawake render -c examples/inventory/dev.yaml -o /tmp/render-dev
          clawake render -c examples/inventory/prod.yaml -o /tmp/render-prod
