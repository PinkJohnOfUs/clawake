version: 1
cluster:
  name: single-host-mvp
  mode: single_host
  primary_host: solo-host
hosts:
  - name: solo-host
    quadlet_root: ~/.config/containers/systemd
instances:
  - name: openclaw-product-owner
    host: solo-host
    role: product_owner
    profile: public
    workspace_path: ${CLAWAKE_WORKSPACE_ROOT}/examples/workspaces/product-owner
    config_path: ${CLAWAKE_WORKSPACE_ROOT}/examples/clawake-config/product-owner
    state_path: ${CLAWAKE_WORKSPACE_ROOT}/examples/clawake-state/product-owner
    quadlet_path: openclaw-product-owner.container
    container_name: openclaw-product-owner
    image:
      repository: ghcr.io/openclaw/gateway
      tag: "0.14.0"
      digest: sha256:1111111111111111111111111111111111111111111111111111111111111111
      known_good_digest: sha256:1111111111111111111111111111111111111111111111111111111111111111
    ports:
      - bind_address: 0.0.0.0
        host_port: 9010
        container_port: 18789
        protocol: tcp
      - bind_address: 0.0.0.0
        host_port: 9012
        container_port: 18790
        protocol: tcp
    env_files:
      - /srv/openclaw/product_owner/.env
    labels:
      env: dev
      audience: external
    gateway_runtime:
      enabled: true
      bind: lan
    backup_policy:
      enabled: true
      pre_mutation: true
      retention: 5
    dashboard:
      friendly_name: Product Owner Instance
      owner: Business Owner
      description: External-facing Product Owner runtime
      tags: [product_owner, public]

  - name: openclaw-developer
    host: solo-host
    role: developer
    profile: internal
    workspace_path: ${CLAWAKE_WORKSPACE_ROOT}/examples/workspaces/developer
    config_path: ${CLAWAKE_WORKSPACE_ROOT}/examples/clawake-config/developer
    state_path: ${CLAWAKE_WORKSPACE_ROOT}/examples/clawake-state/developer
    quadlet_path: openclaw-developer.container
    container_name: openclaw-developer
    image:
      repository: ghcr.io/openclaw/gateway
      tag: "0.14.0"
      digest: sha256:2222222222222222222222222222222222222222222222222222222222222222
      known_good_digest: sha256:2222222222222222222222222222222222222222222222222222222222222222
    ports:
      - bind_address: 127.0.0.1
        host_port: 9011
        container_port: 18789
        protocol: tcp
      - bind_address: 127.0.0.1
        host_port: 9013
        container_port: 18790
        protocol: tcp
    env_files:
      - /srv/openclaw/developer/.env
    labels:
      env: dev
      audience: internal
    gateway_runtime:
      enabled: true
      bind: local
    backup_policy:
      enabled: true
      pre_mutation: true
      retention: 5
    dashboard:
      friendly_name: Developer Instance
      owner: Edge Team
      description: Internal developer runtime
      tags: [developer, internal]
