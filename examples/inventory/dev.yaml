version: 1
cluster:
  name: single-host-mvp
  mode: single_host
  primary_host: solo-host
hosts:
  - name: solo-host
    quadlet_root: ~/.config/containers/systemd
instances:
  - name: openclaw-product-owner
    host: solo-host
    role: product_owner
    profile: public
    workspace_path: /srv/openclaw/product_owner/workspace
    config_path: /srv/openclaw/product_owner/config
    state_path: /srv/openclaw/product_owner/state
    service_scope: user
    quadlet_path: openclaw-product-owner.container
    container_name: openclaw-product-owner
    image:
      repository: ghcr.io/openclaw/gateway
      tag: "0.14.0"
      digest: sha256:1111111111111111111111111111111111111111111111111111111111111111
      known_good_digest: sha256:1111111111111111111111111111111111111111111111111111111111111111
    ports:
      - bind_address: 0.0.0.0
        host_port: 9010
        container_port: 8080
        protocol: tcp
    env_files:
      - /srv/openclaw/product_owner/.env
    labels:
      env: dev
      audience: external
    public_url: http://localhost:9010
    health:
      path: /health
      interval_seconds: 30
      timeout_seconds: 5
      retries: 3
    update_policy:
      channel: stable
      strategy: manual
      auto_apply: false
    backup_policy:
      enabled: true
      pre_mutation: true
      retention: 5
      paths: []
    dashboard:
      friendly_name: Product Owner Instance
      owner: Business Owner
      description: External-facing Product Owner runtime
      tags: [product_owner, public]

  - name: openclaw-developer
    host: solo-host
    role: developer
    profile: internal
    workspace_path: /srv/openclaw/developer/workspace
    config_path: /srv/openclaw/developer/config
    state_path: /srv/openclaw/developer/state
    service_scope: user
    quadlet_path: openclaw-developer.container
    container_name: openclaw-developer
    image:
      repository: ghcr.io/openclaw/gateway
      tag: "0.14.0"
      digest: sha256:2222222222222222222222222222222222222222222222222222222222222222
      known_good_digest: sha256:2222222222222222222222222222222222222222222222222222222222222222
    ports:
      - bind_address: 127.0.0.1
        host_port: 9011
        container_port: 8080
        protocol: tcp
    env_files:
      - /srv/openclaw/developer/.env
    labels:
      env: dev
      audience: internal
    public_url: http://localhost:9011
    health:
      path: /health
      interval_seconds: 30
      timeout_seconds: 5
      retries: 3
    update_policy:
      channel: stable
      strategy: manual
      auto_apply: false
    backup_policy:
      enabled: true
      pre_mutation: true
      retention: 5
      paths: []
    dashboard:
      friendly_name: Developer Instance
      owner: Edge Team
      description: Internal developer runtime
      tags: [developer, internal]
